# Production deployment for tokenusage.
#
#   1. Set TOKENUSAGE_DOMAIN to the domain you've pointed at this server.
#      Caddy will provision a TLS cert from Let's Encrypt automatically.
#      (For local testing without a real domain: `TOKENUSAGE_DOMAIN=localhost`
#      uses Caddy's local-CA flow; trust the cert it prints in the logs.)
#
#   2. `docker compose up -d --build`
#
#   3. Hit https://<your domain>/ and create the admin account on /signup.
#
# The host's `tokenusage_data` volume holds your server.db. Back it up.

services:
  app:
    build: .
    image: tokenusage:latest
    restart: unless-stopped
    environment:
      TOKENUSAGE_SERVER_DB: /data/server.db
      TOKENUSAGE_PUBLIC_URL: https://${TOKENUSAGE_DOMAIN:-localhost}
      # Optional — when set, lets /models hit OpenRouter with auth for
      # higher rate limits and paves the way for credits/generation
      # endpoints. The public /api/v1/models path still works without.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional Google Sign-In; both must be set for the button to render.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Surfaced to /install.sh + /api/sync-wait so the agent learns where
      # to POST tarballs without going through Cloudflare's 100 MB cap.
      TOKENUSAGE_DIRECT_DOMAIN: ${TOKENUSAGE_DIRECT_DOMAIN:-}
    volumes:
      - tokenusage_data:/data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    build: ./caddy
    image: tokenusage-caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TOKENUSAGE_DOMAIN: ${TOKENUSAGE_DOMAIN:-localhost}
      TOKENUSAGE_DEV_DOMAIN: ${TOKENUSAGE_DEV_DOMAIN:-dev.localhost}
      # Non-proxied upload endpoint. Same upstream as the prod site, but
      # the DNS record is "DNS only" at Cloudflare so the agent's POSTs
      # avoid CF's 100 MB body cap.
      TOKENUSAGE_DIRECT_DOMAIN: ${TOKENUSAGE_DIRECT_DOMAIN:-direct.localhost}
      # Required when sites are behind Cloudflare proxy so LE renewals
      # use DNS-01 instead of HTTP-01. Caddy fails to start without it
      # if the Caddyfile references the dns module — set in .env.
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN required for DNS-01 challenge — see .env.example}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge
    depends_on:
      - app

volumes:
  tokenusage_data:
  caddy_data:
  caddy_config:

networks:
  default:
  edge:
    name: tokenusage_edge
